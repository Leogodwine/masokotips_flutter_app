plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def localProperties = new Properties()
def localPropertiesFile = new File(rootProject.projectDir, "local.properties")
if (localPropertiesFile.exists()) {
    localProperties.load(new FileInputStream(localPropertiesFile))
}

def flutterRoot = localProperties.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new RuntimeException("Flutter SDK not found. Define location with flutter.sdk in the local.properties file.")
}

def flutterVersionCode = localProperties.getProperty('flutter.versionCode')
if (flutterVersionCode == null) {
    flutterVersionCode = '1'
}

def flutterVersionName = localProperties.getProperty('flutter.versionName')
if (flutterVersionName == null) {
    flutterVersionName = '1.0'
}

// Load keystore properties once
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace "com.masokotips.app"
    compileSdkVersion flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    // Support for 16 KB memory page sizes (required for Android 15+)
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }
    
    // Enable page size agnostic builds
    bundle {
        language {
            enableSplit = false
        }
        density {
            enableSplit = false
        }
        abi {
            enableSplit = false
        }
    }
    
    // Support for 16 KB memory page sizes (required for Android 15+)
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    
    // Enable page size agnostic builds
    ndkVersion "25.1.8937393"
    
    // Support for 16 KB memory page sizes (required for Android 15+)
    packagingOptions {
        jniLibs {
            useLegacyPackaging = false
        }
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.masokotips.app"
        minSdkVersion 21
        //noinspection EditedTargetSdkVersion
        targetSdkVersion 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName
        multiDexEnabled true
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        vectorDrawables.useSupportLibrary = true
        resConfigs "en"
        ndk {
            abiFilters "armeabi-v7a", "arm64-v8a"
        }
        // Support for 16 KB memory page sizes (required for Android 15+)
        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared", "-DCMAKE_ANDROID_PAGE_SIZE_AGNOSTIC=ON"
            }
        }
        packagingOptions {
            resources {
                excludes += [
                        'META-INF/DEPENDENCIES',
                        'META-INF/LICENSE',
                        'META-INF/LICENSE.txt',
                        'META-INF/license.txt',
                        'META-INF/NOTICE',
                        'META-INF/NOTICE.txt',
                        'META-INF/notice.txt',
                        'META-INF/NOTICE.md',
                        'META-INF/NOTICE.md.txt'
                ]
            }
        }
    }

    signingConfigs {
        release {
            // DO NOT hardcode secrets in VCS. Use key.properties
            if (keystorePropertiesFile.exists()) {
                storeFile file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            if (signingConfigs.release.storeFile != null) {
                signingConfig signingConfigs.release
            }
            minifyEnabled true
            shrinkResources true
            ndk {
                // Generate native debug symbols for Play Console crash/ANR deobfuscation
                debugSymbolLevel 'FULL' // or 'SYMBOL_TABLE' for more detail
            }
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    // Support for 16 KB memory page sizes (required for Android 15+)
    externalNativeBuild {
        cmake {
            path "CMakeLists.txt"
            version "3.22.1"
        }
    }
    
}

flutter {
    source '../..'
}

dependencies {
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.multidex:multidex:2.0.1'
}